[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-x"
version = "1.0.0"
description = "Modular defensive cybersecurity assessment framework"
requires-python = ">=3.9"
dependencies = ["rich>=13.7,<15"]

[project.scripts]
nexus-x = "nexus.cli:main"
